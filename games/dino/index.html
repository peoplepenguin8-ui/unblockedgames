<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 240px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      gap: 16px;
      font-size: 14px;
      font-weight: 700;
      font-family: monospace;
      color: #94a3b8;
    }
    .hud strong { color: #38bdf8; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
    .help {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="c" width="600" height="240"></canvas>
    <div class="hud">
      <div>HI <strong id="hi-score">00000</strong></div>
      <div><strong id="curr-score">00000</strong></div>
    </div>
    <div class="overlay active" id="overlay">
      <h1 id="title" style="font-size: 24px; font-weight: 800; color: #f8fafc;">T-REX RUNNER</h1>
      <button class="btn" id="start-btn">SPACE TO JUMP</button>
    </div>
  </div>

  <div class="help">
    Press [SPACE] or [▲] to Jump · [▼] to Duck · Click/Tap on mobile
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hiScoreEl = document.getElementById('hi-score');
    const currScoreEl = document.getElementById('curr-score');
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('title');
    const startBtn = document.getElementById('start-btn');

    let hiScore = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiScoreEl.textContent = String(hiScore).padStart(5, '0');

    let isPlaying = false;
    let score = 0;
    let speed = 6;
    const groundY = 190;

    const dino = {
      x: 50,
      y: groundY - 44,
      w: 36,
      h: 44,
      vy: 0,
      gravity: 0.75,
      jumpForce: -12.5,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let clouds = [];
    let frame = 0;

    function reset() {
      score = 0;
      speed = 6;
      dino.y = groundY - 44;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      obstacles = [];
      clouds = [];
      frame = 0;
      for (let i = 0; i < 3; i++) {
        clouds.push({ x: 100 + i * 200, y: 30 + Math.random() * 40 });
      }
      overlay.classList.remove('active');
      isPlaying = true;
    }

    function jump() {
      if (!isPlaying) { reset(); return; }
      if (dino.isGrounded) {
        dino.vy = dino.jumpForce;
        dino.isGrounded = false;
      }
    }

    function duck(ducking) {
      if (!isPlaying) return;
      dino.isDucking = ducking;
      if (ducking && !dino.isGrounded) {
        dino.vy += 4; // fast fall
      }
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        duck(true);
      }
    });

    window.addEventListener('keyup', e => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        duck(false);
      }
    });

    canvas.addEventListener('pointerdown', jump);
    startBtn.onclick = reset;

    function spawnObstacle() {
      const isBird = score > 150 && Math.random() < 0.35;
      if (isBird) {
        obstacles.push({
          x: canvas.width,
          y: groundY - 55 - (Math.random() > 0.5 ? 20 : 0),
          w: 34,
          h: 22,
          type: 'bird'
        });
      } else {
        const big = Math.random() > 0.5;
        obstacles.push({
          x: canvas.width,
          y: groundY - (big ? 45 : 32),
          w: big ? 24 : 16,
          h: big ? 45 : 32,
          type: 'cactus'
        });
      }
    }

    function gameOver() {
      isPlaying = false;
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('dino_hi', hiScore);
        hiScoreEl.textContent = String(hiScore).padStart(5, '0');
      }
      title.textContent = 'GAME OVER';
      startBtn.textContent = 'TRY AGAIN';
      overlay.classList.add('active');
    }

    function loop() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        if (isPlaying) c.x -= 0.5;
        if (c.x < -60) c.x = canvas.width + 20;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 16, 0, Math.PI * 2);
        ctx.arc(c.x + 14, c.y - 4, 12, 0, Math.PI * 2);
        ctx.arc(c.x + 28, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      if (isPlaying) {
        frame++;
        score = Math.floor(frame / 6);
        currScoreEl.textContent = String(score).padStart(5, '0');
        speed = 6 + Math.min(6, score / 150);

        // Dino physics
        dino.vy += dino.gravity;
        dino.y += dino.vy;

        const normalH = 44;
        const duckH = 26;
        const currentH = dino.isDucking ? duckH : normalH;

        if (dino.y + currentH >= groundY) {
          dino.y = groundY - currentH;
          dino.vy = 0;
          dino.isGrounded = true;
        }

        // Spawn obstacles
        if (frame % Math.max(55, Math.floor(110 - speed * 4)) === 0) {
          if (Math.random() < 0.75) spawnObstacle();
        }

        // Move obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed;

          // Hitbox test
          const dw = dino.isDucking ? 44 : dino.w;
          const dh = dino.isDucking ? duckH : normalH;
          if (
            dino.x + 4 < obs.x + obs.w &&
            dino.x + dw - 4 > obs.x &&
            dino.y + 4 < obs.y + obs.h &&
            dino.y + dh > obs.y
          ) {
            gameOver();
            break;
          }

          if (obs.x + obs.w < -20) {
            obstacles.splice(i, 1);
          }
        }
      }

      // Draw Dino
      ctx.fillStyle = '#38bdf8';
      if (dino.isDucking) {
        ctx.fillRect(dino.x, dino.y, 44, 26);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + 36, dino.y + 4, 4, 4); // Eye
      } else {
        ctx.fillRect(dino.x, dino.y, dino.w, 44);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + dino.w - 10, dino.y + 6, 4, 4); // Eye
      }

      // Draw Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.fillRect(obs.x - 3, obs.y + 8, obs.w + 6, 6);
        } else {
          // Bird
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          // Wing flap
          const wingUp = (frame % 16) < 8;
          ctx.fillRect(obs.x + 8, obs.y + (wingUp ? -6 : 14), 14, 6);
        }
      });

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
