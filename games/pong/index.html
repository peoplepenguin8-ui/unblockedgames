<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 560px;
      margin-bottom: 8px;
    }
    .score-card {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .score-card.ai { color: #f43f5e; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .mode-select {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score-card" id="p1-score">0</div>
    <div style="font-size: 14px; color: #64748b; align-self: center;">FIRST TO 7</div>
    <div class="score-card ai" id="p2-score">0</div>
  </div>

  <div class="canvas-wrap" id="pong-container">
    <canvas id="c" width="640" height="360"></canvas>
    <div class="overlay active" id="overlay">
      <h1 id="title" style="font-size: 26px; color: #38bdf8; font-weight: 900;">CYBER PONG</h1>
      <p id="sub" style="font-size: 13px; color: #94a3b8;">Select game mode</p>
      <div class="mode-select">
        <button class="btn" id="btn-1p">1 PLAYER (VS BOT)</button>
        <button class="btn" id="btn-2p" style="background: #334155;">2 PLAYERS LOCAL</button>
      </div>
    </div>
  </div>

  <div class="hint">
    P1: [W]/[S] or Touch · P2: [▲]/[▼] or CPU · First to 7 wins!
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const btn1p = document.getElementById('btn-1p');
    const btn2p = document.getElementById('btn-2p');

    let mode = '1P';
    let isPlaying = false;
    let score1 = 0;
    let score2 = 0;

    const paddleH = 64;
    const paddleW = 10;
    const p1 = { x: 20, y: 148, vy: 0, speed: 6, up: false, down: false };
    const p2 = { x: canvas.width - 30, y: 148, vy: 0, speed: 5.5, up: false, down: false };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 6,
      vx: 5,
      vy: 2,
      speed: 6
    };

    function resetBall(servingToP2 = true) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 6;
      const angle = (Math.random() * 0.8 - 0.4) * Math.PI;
      ball.vx = (servingToP2 ? 1 : -1) * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function startGame(selectedMode) {
      mode = selectedMode;
      score1 = 0;
      score2 = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1.y = canvas.height / 2 - paddleH / 2;
      p2.y = canvas.height / 2 - paddleH / 2;
      resetBall(Math.random() > 0.5);
      overlay.classList.remove('active');
      isPlaying = true;
    }

    function checkWin() {
      if (score1 >= 7 || score2 >= 7) {
        isPlaying = false;
        title.textContent = score1 >= 7 ? 'PLAYER 1 WINS!' : (mode === '1P' ? 'BOT WINS!' : 'PLAYER 2 WINS!');
        sub.textContent = `${score1} - ${score2}`;
        overlay.classList.add('active');
      }
    }

    btn1p.onclick = () => startGame('1P');
    btn2p.onclick = () => startGame('2P');

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyW') p1.up = true;
      if (e.code === 'KeyS') p1.down = true;
      if (e.code === 'ArrowUp') p2.up = true;
      if (e.code === 'ArrowDown') p2.down = true;
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'KeyW') p1.up = false;
      if (e.code === 'KeyS') p1.down = false;
      if (e.code === 'ArrowUp') p2.up = false;
      if (e.code === 'ArrowDown') p2.down = false;
    });

    // Touch control for P1
    const container = document.getElementById('pong-container');
    container.addEventListener('pointermove', e => {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const mouseY = (e.clientY - rect.top) * scaleY;
      p1.y = Math.max(0, Math.min(canvas.height - paddleH, mouseY - paddleH / 2));
    });

    function loop() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      if (isPlaying) {
        // P1 keyboard movement
        if (p1.up && p1.y > 0) p1.y -= p1.speed;
        if (p1.down && p1.y < canvas.height - paddleH) p1.y += p1.speed;

        // P2 movement
        if (mode === '2P') {
          if (p2.up && p2.y > 0) p2.y -= p2.speed;
          if (p2.down && p2.y < canvas.height - paddleH) p2.y += p2.speed;
        } else {
          // AI bot tracking with reaction delay
          const targetY = ball.y - paddleH / 2;
          if (ball.vx > 0) {
            if (p2.y + paddleH / 2 < ball.y - 8) p2.y += p2.speed;
            else if (p2.y + paddleH / 2 > ball.y + 8) p2.y -= p2.speed;
          }
          p2.y = Math.max(0, Math.min(canvas.height - paddleH, p2.y));
        }

        // Ball movement
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall bounce
        if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = -ball.vy; }
        if (ball.y + ball.r >= canvas.height) { ball.y = canvas.height - ball.r; ball.vy = -ball.vy; }

        // P1 Paddle hit
        if (
          ball.x - ball.r <= p1.x + paddleW &&
          ball.x + ball.r >= p1.x &&
          ball.y >= p1.y &&
          ball.y <= p1.y + paddleH &&
          ball.vx < 0
        ) {
          const hit = (ball.y - (p1.y + paddleH / 2)) / (paddleH / 2);
          ball.speed = Math.min(11, ball.speed + 0.3);
          const angle = hit * (Math.PI / 3);
          ball.vx = ball.speed * Math.cos(angle);
          ball.vy = ball.speed * Math.sin(angle);
          ball.x = p1.x + paddleW + ball.r;
        }

        // P2 Paddle hit
        if (
          ball.x + ball.r >= p2.x &&
          ball.x - ball.r <= p2.x + paddleW &&
          ball.y >= p2.y &&
          ball.y <= p2.y + paddleH &&
          ball.vx > 0
        ) {
          const hit = (ball.y - (p2.y + paddleH / 2)) / (paddleH / 2);
          ball.speed = Math.min(11, ball.speed + 0.3);
          const angle = hit * (Math.PI / 3);
          ball.vx = -ball.speed * Math.cos(angle);
          ball.vy = ball.speed * Math.sin(angle);
          ball.x = p2.x - ball.r;
        }

        // Scoring
        if (ball.x < 0) {
          score2++;
          p2ScoreEl.textContent = score2;
          checkWin();
          if (isPlaying) resetBall(false);
        } else if (ball.x > canvas.width) {
          score1++;
          p1ScoreEl.textContent = score1;
          checkWin();
          if (isPlaying) resetBall(true);
        }
      }

      // Draw paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, paddleW, paddleH);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(p2.x, p2.y, paddleW, paddleH);

      // Draw ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
