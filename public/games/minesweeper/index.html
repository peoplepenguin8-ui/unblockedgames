<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .board-frame {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-bar {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lcd {
      background: #000;
      color: #ef4444;
      font-family: monospace;
      font-size: 24px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 2px;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .face-btn:active { background: #1e293b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 34px);
      grid-gap: 3px;
      background: #0f172a;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 34px;
      height: 34px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.2), inset -1px -1px 0 rgba(0,0,0,0.4);
    }
    .cell.revealed {
      background: #0f172a;
      border-color: #1e293b;
      box-shadow: none;
      cursor: default;
    }
    .cell.mine { background: #ef4444; color: #fff; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #22c55e; }
    .c-3 { color: #ef4444; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #f59e0b; }
    .controls-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
    .flag-toggle-btn {
      margin-top: 8px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }
    @media (pointer: coarse) {
      .flag-toggle-btn { display: inline-block; }
    }
  </style>
</head>
<body>
  <div class="board-frame">
    <div class="top-bar">
      <div class="lcd" id="mine-count">010</div>
      <div class="face-btn" id="face-btn">😊</div>
      <div class="lcd" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <button class="flag-toggle-btn" id="flag-mode-btn">Mode: ⛏️ Dig (Tap to switch to 🚩 Flag)</button>

  <div class="controls-hint">
    Left Click to Dig · Right Click to Flag · Click Face to Restart
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let state = 'IDLE'; // IDLE, PLAYING, WON, LOST
    let timerVal = 0;
    let timerInterval = null;
    let flagMode = false;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');
    const flagModeBtn = document.getElementById('flag-mode-btn');

    flagModeBtn.onclick = () => {
      flagMode = !flagMode;
      flagModeBtn.textContent = flagMode ? 'Mode: 🚩 Flag (Tap to Dig)' : 'Mode: ⛏️ Dig (Tap to Flag)';
      flagModeBtn.style.background = flagMode ? '#e11d48' : '#334155';
    };

    function initBoard() {
      board = [];
      gridEl.innerHTML = '';
      clearInterval(timerInterval);
      timerVal = 0;
      timerEl.textContent = '000';
      mineCountEl.textContent = String(MINES).padStart(3, '0');
      faceBtn.textContent = '😊';
      state = 'IDLE';

      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: null
          };
          const div = document.createElement('div');
          div.className = 'cell';
          div.oncontextmenu = e => { e.preventDefault(); toggleFlag(cell); };
          div.onclick = () => {
            if (flagMode) toggleFlag(cell);
            else clickCell(cell);
          };
          gridEl.appendChild(div);
          cell.el = div;
          row.push(cell);
        }
        board.push(row);
      }
    }

    function plantMines(firstR, firstC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if ((r === firstR && c === firstC) || board[r][c].mine) continue;
        board[r][c].mine = true;
        planted++;
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                count++;
              }
            }
          }
          board[r][c].count = count;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerVal++;
        timerEl.textContent = String(Math.min(999, timerVal)).padStart(3, '0');
      }, 1000);
    }

    function clickCell(cell) {
      if (state === 'WON' || state === 'LOST' || cell.revealed || cell.flagged) return;

      if (state === 'IDLE') {
        plantMines(cell.r, cell.c);
        state = 'PLAYING';
        startTimer();
      }

      if (cell.mine) {
        // Game Over
        state = 'LOST';
        clearInterval(timerInterval);
        faceBtn.textContent = '😵';
        revealAll();
        return;
      }

      revealCell(cell);
      checkWin();
    }

    function toggleFlag(cell) {
      if (state === 'WON' || state === 'LOST' || cell.revealed) return;
      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';

      // Update mine counter
      let flags = 0;
      board.flat().forEach(c => { if (c.flagged) flags++; });
      mineCountEl.textContent = String(Math.max(-99, MINES - flags)).padStart(3, '0');
    }

    function revealCell(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      cell.el.classList.add('revealed');
      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c-${cell.count}`);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cell.r + dr, nc = cell.c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(board[nr][nc]);
            }
          }
        }
      }
    }

    function revealAll() {
      board.flat().forEach(cell => {
        if (cell.mine) {
          cell.el.classList.add('mine');
          cell.el.textContent = '💣';
        }
      });
    }

    function checkWin() {
      const allNonMinesRevealed = board.flat().every(c => c.mine || c.revealed);
      if (allNonMinesRevealed) {
        state = 'WON';
        clearInterval(timerInterval);
        faceBtn.textContent = '😎';
        board.flat().forEach(c => {
          if (c.mine) c.el.textContent = '🚩';
        });
      }
    }

    faceBtn.onclick = initBoard;
    initBoard();
  </script>
</body>
</html>
